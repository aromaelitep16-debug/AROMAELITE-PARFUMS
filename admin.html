<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0d; --panel:#14141b; --panel-2:#1b1b23; --line:#2a2a33; --line-soft:#1f1f27;
  --gold-1:#f4e6b8; --gold-2:#d9b45a; --gold-3:#b8893a; --gold-deep:#8a6522;
  --gold-grad:linear-gradient(135deg,#f4e6b8,#e6c76b 30%,#c99a3e 60%,#f4e6b8);
  --cream:#f2ecdf; --muted:#8f8a7a; --muted-2:#6a6659; --ok:#7bd88f; --danger:#e0796b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg); color:var(--cream); font-family:'Jost',system-ui,sans-serif; min-height:100vh}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; color:var(--cream); padding:10px 12px; font-size:.9rem; outline:none}
input:focus,select,textarea:focus{border-color:var(--gold-3)}
label{font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-3); display:block; margin-bottom:6px}
img{display:block;max-width:100%}

/* Login */
.login{min-height:100vh; display:grid; place-items:center; padding:20px}
.login .box{width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:32px 26px}
.login h1{font-family:'Cinzel',serif; text-align:center; margin-bottom:6px; font-size:1.4rem}
.login p{text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:22px}
.login .field{margin-bottom:14px}
.btn{background:var(--gold-grad); color:#0a0a0d; font-weight:600; padding:12px 18px; border-radius:10px; font-size:.9rem}
.btn:hover{filter:brightness(1.05)}
.btn.full{width:100%}
.btn.ghost{background:var(--panel-2); border:1px solid var(--line); color:var(--cream); font-weight:500}
.btn.danger{background:none; border:1px solid var(--danger); color:var(--danger); font-weight:500}
.err{color:var(--danger); font-size:.82rem; margin-top:8px; text-align:center}

/* App */
.app{max-width:1000px; margin:0 auto; padding:20px}
.bar{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.bar h2{font-family:'Cormorant Garamond',serif; font-size:1.7rem; margin-right:auto}
.tabs{display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:12px}
.tab{padding:9px 16px; border-radius:9px; color:var(--muted); font-size:.86rem}
.tab.active{background:var(--gold-grad); color:#0a0a0d; font-weight:500}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.field{margin-bottom:14px}
.hint{font-size:.76rem; color:var(--muted); margin:-6px 0 10px}
.check{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.check input{width:auto}
.check label{margin:0; text-transform:none; letter-spacing:0; color:var(--cream); font-size:.88rem}

.list{display:flex; flex-direction:column; gap:10px}
.item{display:flex; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:11px 13px}
.item .th{width:48px; height:48px; border-radius:9px; overflow:hidden; background:var(--panel-2); flex:0 0 auto; display:grid; place-items:center; color:var(--gold-deep); font-family:'Cormorant Garamond',serif}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .info{flex:1; min-width:0}
.item .n{font-weight:500}
.item .sub{font-size:.76rem; color:var(--muted)}
.tg{display:inline-block; font-size:.66rem; padding:2px 8px; border-radius:999px; border:1px solid var(--gold-deep); color:var(--gold-2); margin-left:6px}
.tg.off{border-color:var(--muted-2); color:var(--muted-2)}
.item .acts{display:flex; gap:8px}
.iconbtn{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); display:grid; place-items:center; font-size:.9rem}
.iconbtn:hover{border-color:var(--gold-3)}

/* Overlay form */
.ov{position:fixed; inset:0; z-index:60; background:rgba(4,4,6,.75); backdrop-filter:blur(6px); display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:24px 14px}
.ov.open{display:flex}
.modal{width:100%; max-width:600px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px}
.modal h3{font-family:'Cormorant Garamond',serif; font-size:1.5rem; margin-bottom:18px}
.pres-row{display:grid; grid-template-columns:1fr 1fr 1fr auto auto; gap:8px; align-items:center; margin-bottom:8px}
.pres-row .chk{display:grid; place-items:center}
.pres-row .chk input{width:20px;height:20px}
.pres-row .del{color:var(--danger); font-size:1.2rem; padding:0 4px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.np{padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:.82rem}
.np.sel{border-color:var(--gold-2); color:var(--gold-1); background:rgba(184,137,58,.12)}
.imgs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.imgs .im{position:relative; width:64px; height:64px; border-radius:9px; overflow:hidden; border:1px solid var(--line)}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im button{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; font-size:.9rem; display:grid; place-items:center}
.modal .actions{display:flex; gap:10px; margin-top:20px}
.subfield{margin-top:12px}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--gold-deep); color:var(--cream); padding:12px 20px; border-radius:999px; font-size:.86rem; opacity:0; pointer-events:none; transition:.3s; z-index:90}
.toast.show{opacity:1}
.toast.bad{border-color:var(--danger)}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}.bar h2{font-size:1.4rem}.pres-row{grid-template-columns:1fr 1fr 1fr auto auto}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">
    <h1 class="gold-text" style="background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">Panel Admin</h1>
    <p id="loginStore"></p>
    <div class="field"><label>Correo</label><input id="email" type="email" placeholder="tucorreo@ejemplo.com"></div>
    <div class="field"><label>Contraseña</label><input id="password" type="password" placeholder="••••••••"></div>
    <button class="btn full" id="loginBtn">Ingresar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <div class="bar">
    <h2 id="storeTitle">Catálogo</h2>
    <div class="tabs">
      <button class="tab active" data-tab="productos">Productos</button>
      <button class="tab" data-tab="notas">Notas</button>
      <button class="tab" data-tab="promos">Promociones</button>
    </div>
    <button class="btn danger" id="logout">Salir</button>
  </div>

  <section id="tab-productos">
    <div class="bar"><button class="btn" id="newProd">+ Nuevo producto</button></div>
    <div class="list" id="listProd"></div>
  </section>

  <section id="tab-notas" style="display:none">
    <div class="bar"><button class="btn" id="newNota">+ Nueva nota</button></div>
    <div class="list" id="listNotas"></div>
  </section>

  <section id="tab-promos" style="display:none">
    <div class="bar"><button class="btn" id="newPromo">+ Nueva promoción</button></div>
    <div class="list" id="listPromos"></div>
  </section>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const BUCKET = CONFIG.BUCKET || 'catalogo';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MLS = ['3','5','10','30','Sellado'];
$('#loginStore').textContent = CONFIG.TIENDA_NOMBRE;
$('#storeTitle').textContent = CONFIG.TIENDA_NOMBRE;

let PRODUCTOS=[], NOTAS=[], REL=[], PROMOS=[];

/* ============ Auth ============ */
async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) showApp();
}
function showApp(){ $('#login').style.display='none'; $('#app').style.display='block'; boot(); }
async function login(){
  const email=$('#email').value.trim(), password=$('#password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('#loginErr').textContent = 'No se pudo ingresar. Revisa tu correo/contraseña.'; return; }
  showApp();
}
$('#loginBtn').onclick = login;
$('#password').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
$('#logout').onclick = async()=>{ await sb.auth.signOut(); location.reload(); };

/* ============ Tabs ============ */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  $('#tab-productos').style.display = t.dataset.tab==='productos'?'block':'none';
  $('#tab-notas').style.display    = t.dataset.tab==='notas'?'block':'none';
  $('#tab-promos').style.display   = t.dataset.tab==='promos'?'block':'none';
});

/* ============ Carga ============ */
async function boot(){ await Promise.all([loadNotas(), loadProductos(), loadPromos()]); }
async function loadNotas(){ const {data}=await sb.from('notas').select('*').order('nombre'); NOTAS=data||[]; renderNotas(); }
async function loadPromos(){ const {data}=await sb.from('promociones').select('*').order('created_at',{ascending:false}); PROMOS=data||[]; renderPromos(); }
async function loadProductos(){
  const {data}=await sb.from('productos').select('*').order('orden').order('created_at',{ascending:false});
  PRODUCTOS=data||[];
  const {data:rel}=await sb.from('producto_notas').select('*'); REL=rel||[];
  renderProductos();
}
async function uploadImg(file, folder){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:true});
  if(error){ toast('Error subiendo imagen: '+error.message,true); return null; }
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
function presActivas(p){ return (p.presentaciones||[]).filter(x=>x&&Number(x.precio)>0); }
function notasDe(pid){ return REL.filter(r=>r.producto_id===pid).map(r=>NOTAS.find(n=>n.id===r.nota_id)).filter(Boolean); }
function imgsOf(p){ const a=Array.isArray(p.imagenes)?p.imagenes.filter(Boolean):[]; return a.length?a:(p.imagen_url?[p.imagen_url]:[]); }
function mlLabel(ml){ return String(ml).toLowerCase()==='sellado'?'Sellado':ml+'ml'; }

/* ============ PRODUCTOS ============ */
function renderProductos(){
  if(!PRODUCTOS.length){ $('#listProd').innerHTML='<div class="hint">Aún no hay productos. Crea el primero.</div>'; return; }
  $('#listProd').innerHTML = PRODUCTOS.map(p=>{
    const img=imgsOf(p)[0]; const pres=presActivas(p);
    return `<div class="item">
      <div class="th">${img?`<img src="${esc(img)}">`:esc((p.marca||p.nombre||'?')[0])}</div>
      <div class="info">
        <div class="n">${esc(p.nombre)} ${p.destacado?'<span class="tg">Destacado</span>':''} ${p.visible===false?'<span class="tg off">Oculto</span>':''}</div>
        <div class="sub">${esc(p.marca||'')} · ${esc(p.categoria||'')} · ${esc(p.genero||'')} · ${pres.length} presentación${pres.length!==1?'es':''}</div>
      </div>
      <div class="acts">
        <button class="iconbtn" data-edit="${p.id}">✏️</button>
        <button class="iconbtn" data-del="${p.id}">🗑️</button>
      </div>
    </div>`;
  }).join('');
  $('#listProd').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>prodForm(b.dataset.edit));
  $('#listProd').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delProd(b.dataset.del));
}

function prodForm(id){
  const p = id ? PRODUCTOS.find(x=>x.id===id) : {};
  let imgs = imgsOf(p).slice();
  let pres = (p.presentaciones && p.presentaciones.length) ? JSON.parse(JSON.stringify(p.presentaciones)) : [{ml:'5',precio:'',antes:'',activo:true},{ml:'10',precio:'',antes:'',activo:true}];
  let selNotas = new Set(notasDe(id).map(n=>n.id));
  const cats=CONFIG.CATEGORIAS||['Árabe','Diseñador','Nicho'];
  const gens=CONFIG.GENEROS||['Hombre','Mujer','Unisex'];

  $('#modal').innerHTML = `
    <h3>${id?'Editar':'Nuevo'} producto</h3>
    <div class="grid2">
      <div class="field"><label>Marca</label><input id="pMarca" value="${esc(p.marca||'')}"></div>
      <div class="field"><label>Nombre</label><input id="pNombre" value="${esc(p.nombre||'')}"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Categoría</label><select id="pCat">${cats.map(c=>`<option ${p.categoria===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Género</label><select id="pGen">${gens.map(g=>`<option ${p.genero===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
      <div class="field"><label>Orden</label><input id="pOrden" type="number" value="${p.orden??0}"></div>
    </div>
    <div class="field"><label>Descripción corta</label><input id="pDesc" value="${esc(p.descripcion||'')}" placeholder="Ej. Fresco, amaderado, elegante"></div>

    <div class="field"><label>Imágenes</label>
      <input id="pFiles" type="file" accept="image/*" multiple>
      <div class="imgs" id="imgList"></div>
    </div>

    <div class="field"><label>Presentaciones (talla · precio · antes · ✓ visible)</label>
      <div class="hint">Marca ✓ para mostrarla. "antes" es opcional (precio tachado). Usa "Sellado" para botella completa.</div>
      <div id="presList"></div>
      <div class="chips" style="margin-top:8px">${MLS.map(m=>`<button class="np" data-addml="${m}">+ ${mlLabel(m)}</button>`).join('')}</div>
    </div>

    <div class="field"><label>Notas aromáticas (biblioteca)</label>
      <div class="chips" id="notasPick">${NOTAS.length?NOTAS.map(n=>`<button class="np ${selNotas.has(n.id)?'sel':''}" data-nota="${n.id}">${esc(n.nombre)}</button>`).join(''):'<span class="hint">No hay notas aún. Créalas en la pestaña Notas.</span>'}</div>
    </div>

    <div class="grid3">
      <div class="field"><label>Notas de salida</label><input id="pSalida" value="${esc(p.notas_salida||'')}"></div>
      <div class="field"><label>Notas de corazón</label><input id="pCorazon" value="${esc(p.notas_corazon||'')}"></div>
      <div class="field"><label>Notas de fondo</label><input id="pFondo" value="${esc(p.notas_fondo||'')}"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Duración</label><input id="pLong" value="${esc(p.longevidad||'')}" placeholder="Ej. 8-10 h"></div>
      <div class="field"><label>Estela</label><input id="pEstela" value="${esc(p.estela||'')}" placeholder="Ej. Moderada"></div>
      <div class="field"><label>Ocasión</label><input id="pOcasion" value="${esc(p.ocasion||'')}" placeholder="Ej. Noche"></div>
    </div>

    <div class="check"><input type="checkbox" id="pDest" ${p.destacado?'checked':''}><label for="pDest">Destacado (aparece con etiqueta)</label></div>
    <div class="check"><input type="checkbox" id="pVis" ${p.visible!==false?'checked':''}><label for="pVis">Visible en el catálogo</label></div>

    <div class="actions">
      <button class="btn" id="saveProd">${id?'Guardar cambios':'Crear producto'}</button>
      <button class="btn ghost" id="cancelProd">Cancelar</button>
    </div>`;

  function renderImgs(){
    $('#imgList').innerHTML = imgs.map((u,i)=>`<div class="im"><img src="${esc(u)}"><button data-rmimg="${i}">×</button></div>`).join('');
    $('#imgList').querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=()=>{ imgs.splice(+b.dataset.rmimg,1); renderImgs(); });
  }
  renderImgs();
  $('#pFiles').onchange = async e => {
    const files=[...e.target.files]; if(!files.length)return;
    toast('Subiendo imágenes...');
    for(const f of files){ const u=await uploadImg(f,'productos'); if(u) imgs.push(u); }
    renderImgs(); toast('Imágenes subidas');
  };

  function renderPres(){
    $('#presList').innerHTML = pres.map((x,i)=>`
      <div class="pres-row">
        <input data-pml="${i}" value="${esc(x.ml)}" placeholder="talla">
        <input data-pprecio="${i}" type="number" step="0.01" value="${x.precio??''}" placeholder="precio">
        <input data-pantes="${i}" type="number" step="0.01" value="${x.antes??''}" placeholder="antes">
        <div class="chk"><input type="checkbox" data-pact="${i}" ${x.activo!==false?'checked':''}></div>
        <button class="del" data-pdel="${i}">×</button>
      </div>`).join('');
    $('#presList').querySelectorAll('[data-pml]').forEach(el=>el.oninput=()=>pres[+el.dataset.pml].ml=el.value);
    $('#presList').querySelectorAll('[data-pprecio]').forEach(el=>el.oninput=()=>pres[+el.dataset.pprecio].precio=el.value);
    $('#presList').querySelectorAll('[data-pantes]').forEach(el=>el.oninput=()=>pres[+el.dataset.pantes].antes=el.value);
    $('#presList').querySelectorAll('[data-pact]').forEach(el=>el.onchange=()=>pres[+el.dataset.pact].activo=el.checked);
    $('#presList').querySelectorAll('[data-pdel]').forEach(el=>el.onclick=()=>{ pres.splice(+el.dataset.pdel,1); renderPres(); });
  }
  renderPres();
  document.querySelectorAll('[data-addml]').forEach(b=>b.onclick=()=>{ pres.push({ml:b.dataset.addml,precio:'',antes:'',activo:true}); renderPres(); });

  $('#notasPick').querySelectorAll('[data-nota]').forEach(b=>b.onclick=()=>{
    const nid=b.dataset.nota; if(selNotas.has(nid))selNotas.delete(nid); else selNotas.add(nid);
    b.classList.toggle('sel');
  });

  $('#cancelProd').onclick = closeOv;
  $('#saveProd').onclick = async () => {
    const nombre=$('#pNombre').value.trim(); if(!nombre){ toast('Ponle un nombre',true); return; }
    const presLimpio = pres.filter(x=>String(x.ml).trim() && Number(x.precio)>0)
      .map(x=>({ml:String(x.ml).trim(), precio:Number(x.precio), antes:x.antes?Number(x.antes):null, activo:x.activo!==false}));
    const payload = {
      marca:$('#pMarca').value.trim(), nombre, categoria:$('#pCat').value, genero:$('#pGen').value,
      orden:parseInt($('#pOrden').value)||0, descripcion:$('#pDesc').value.trim(),
      imagenes:imgs, imagen_url:imgs[0]||null, presentaciones:presLimpio,
      notas_salida:$('#pSalida').value.trim()||null, notas_corazon:$('#pCorazon').value.trim()||null, notas_fondo:$('#pFondo').value.trim()||null,
      longevidad:$('#pLong').value.trim()||null, estela:$('#pEstela').value.trim()||null, ocasion:$('#pOcasion').value.trim()||null,
      destacado:$('#pDest').checked, visible:$('#pVis').checked,
    };
    let pid=id, error;
    if(id){ ({error}=await sb.from('productos').update(payload).eq('id',id)); }
    else { const r=await sb.from('productos').insert(payload).select().single(); error=r.error; pid=r.data?.id; }
    if(error){ toast('Error: '+error.message,true); return; }
    // Relaciones de notas
    if(pid){
      await sb.from('producto_notas').delete().eq('producto_id',pid);
      const rows=[...selNotas].map(nid=>({producto_id:pid, nota_id:nid}));
      if(rows.length) await sb.from('producto_notas').insert(rows);
    }
    toast('Guardado ✓'); closeOv(); loadProductos();
  };
  openOv();
}

async function delProd(id){
  if(!confirm('¿Eliminar este producto?')) return;
  const {error}=await sb.from('productos').delete().eq('id',id);
  if(error){ toast('Error: '+error.message,true); return; }
  toast('Eliminado'); loadProductos();
}

/* ============ NOTAS ============ */
function renderNotas(){
  if(!NOTAS.length){ $('#listNotas').innerHTML='<div class="hint">Sin notas. Crea notas aromáticas (jazmín, oud, bergamota...) con su imagen.</div>'; return; }
  $('#listNotas').innerHTML = NOTAS.map(n=>`
    <div class="item">
      <div class="th">${n.imagen_url?`<img src="${esc(n.imagen_url)}">`:esc((n.nombre||'?')[0])}</div>
      <div class="info"><div class="n">${esc(n.nombre)}</div></div>
      <div class="acts"><button class="iconbtn" data-edit="${n.id}">✏️</button><button class="iconbtn" data-del="${n.id}">🗑️</button></div>
    </div>`).join('');
  $('#listNotas').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>notaForm(b.dataset.edit));
  $('#listNotas').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delNota(b.dataset.del));
}
function notaForm(id){
  const n = id?NOTAS.find(x=>x.id===id):{}; let url=n.imagen_url||'';
  $('#modal').innerHTML = `
    <h3>${id?'Editar':'Nueva'} nota</h3>
    <div class="field"><label>Nombre</label><input id="nNombre" value="${esc(n.nombre||'')}" placeholder="Ej. Bergamota"></div>
    <div class="field"><label>Imagen</label><input id="nFile" type="file" accept="image/*"><div class="imgs" id="nImg">${url?`<div class="im"><img src="${esc(url)}"></div>`:''}</div></div>
    <div class="actions"><button class="btn" id="saveNota">${id?'Guardar':'Crear'}</button><button class="btn ghost" id="cancelNota">Cancelar</button></div>`;
  $('#nFile').onchange = async e => { const f=e.target.files[0]; if(!f)return; toast('Subiendo...'); const u=await uploadImg(f,'notas'); if(u){ url=u; $('#nImg').innerHTML=`<div class="im"><img src="${esc(u)}"></div>`; toast('Lista'); } };
  $('#cancelNota').onclick=closeOv;
  $('#saveNota').onclick = async () => {
    const nombre=$('#nNombre').value.trim(); if(!nombre){ toast('Ponle nombre',true); return; }
    const payload={nombre, imagen_url:url||null};
    const {error}= id ? await sb.from('notas').update(payload).eq('id',id) : await sb.from('notas').insert(payload);
    if(error){ toast('Error: '+error.message,true); return; }
    toast('Guardado ✓'); closeOv(); loadNotas();
  };
  openOv();
}
async function delNota(id){ if(!confirm('¿Eliminar esta nota?'))return; const {error}=await sb.from('notas').delete().eq('id',id); if(error){toast('Error: '+error.message,true);return;} toast('Eliminada'); loadNotas(); loadProductos(); }

/* ============ PROMOCIONES ============ */
const PROMO_TIPOS = [
  ['producto','🏷️','Descuento a productos','% off a productos/tallas elegidos'],
  ['cantidad','🔢','Precio por cantidad','Llevando N o más, precio fijo o %'],
  ['combo','🎁','Combo / pack','N a elección por un precio total fijo'],
  ['general','🌐','Descuento general','% a todo el catálogo o una categoría'],
];
function tipoLabel(t){ const x=PROMO_TIPOS.find(p=>p[0]===t); return x?x[2]:t; }

function renderPromos(){
  if(!PROMOS.length){ $('#listPromos').innerHTML='<div class="hint">Sin promociones. Crea descuentos, combos o precios por cantidad.</div>'; return; }
  $('#listPromos').innerHTML = PROMOS.map(p=>`
    <div class="item">
      <div class="th">${(PROMO_TIPOS.find(t=>t[0]===p.tipo)||['','🏷️'])[1]}</div>
      <div class="info"><div class="n">${esc(p.nombre)} ${p.activo?'':'<span class="tg off">Inactiva</span>'}</div><div class="sub">${esc(tipoLabel(p.tipo))}${p.desde||p.hasta?` · ${p.desde||'…'} → ${p.hasta||'…'}`:''}</div></div>
      <div class="acts"><button class="iconbtn" data-edit="${p.id}">✏️</button><button class="iconbtn" data-del="${p.id}">🗑️</button></div>
    </div>`).join('');
  $('#listPromos').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>promoForm(b.dataset.edit));
  $('#listPromos').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delPromo(b.dataset.del));
}

function promoForm(id){
  const p = id?PROMOS.find(x=>x.id===id):{tipo:'producto',activo:true,config:{}};
  let tipo=p.tipo||'producto';
  const c=p.config||{};

  function prodPickHTML(sel){
    const s=new Set(sel||[]);
    return `<div class="chips" id="promoProds">${PRODUCTOS.map(pr=>`<button type="button" class="np ${s.has(pr.id)?'sel':''}" data-p="${pr.id}">${esc(pr.nombre)}</button>`).join('')}</div><div class="hint">Vacío = aplica a todos.</div>`;
  }
  function mlPickHTML(sel){
    const s=new Set((sel||[]).map(String));
    return `<div class="chips" id="promoMls">${MLS.map(m=>`<button type="button" class="np ${s.has(m)?'sel':''}" data-m="${m}">${mlLabel(m)}</button>`).join('')}</div><div class="hint">Vacío = todas las tallas.</div>`;
  }
  function catPickHTML(sel){
    const cats=CONFIG.CATEGORIAS||[];
    return `<div class="subfield"><label>Categoría (opcional)</label><select id="pf_cat2"><option value="todas" ${(!sel||sel==='todas')?'selected':''}>Todas</option>${cats.map(x=>`<option ${sel===x?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="hint">Ej. solo "Árabe" para una promo de árabes.</div></div>`;
  }

  function bodyFor(t){
    if(t==='producto') return `
      <div class="subfield"><label>Productos</label>${prodPickHTML(c.productos)}</div>
      ${catPickHTML(c.categoria)}
      <div class="subfield"><label>Tallas</label>${mlPickHTML(c.mls)}</div>
      <div class="subfield"><label>% de descuento</label><input id="pf_pct" type="number" value="${c.pct??''}" placeholder="Ej. 15"></div>`;
    if(t==='cantidad') return `
      <div class="subfield"><label>Productos</label>${prodPickHTML(c.productos)}</div>
      ${catPickHTML(c.categoria)}
      <div class="subfield"><label>Tallas</label>${mlPickHTML(c.mls)}</div>
      <div class="grid3">
        <div class="subfield"><label>Mínimo (N)</label><input id="pf_min" type="number" value="${c.min??''}" placeholder="Ej. 2"></div>
        <div class="subfield"><label>Modo</label><select id="pf_modo"><option value="precio_fijo" ${c.modo==='precio_fijo'?'selected':''}>Precio fijo c/u</option><option value="pct" ${c.modo==='pct'?'selected':''}>% descuento</option></select></div>
        <div class="subfield"><label>Valor</label><input id="pf_valor" type="number" step="0.01" value="${c.valor??''}" placeholder="S/ o %"></div>
      </div>`;
    if(t==='combo') return `
      <div class="subfield"><label>Productos elegibles</label>${prodPickHTML(c.productos)}</div>
      ${catPickHTML(c.categoria)}
      <div class="subfield"><label>Tallas</label>${mlPickHTML(c.mls)}</div>
      <div class="grid2">
        <div class="subfield"><label>¿Cuántos entran?</label><input id="pf_cant" type="number" value="${c.cantidad??''}" placeholder="Ej. 2"></div>
        <div class="subfield"><label>Precio total S/</label><input id="pf_total" type="number" step="0.01" value="${c.precio_total??''}" placeholder="Ej. 30"></div>
      </div>`;
    return `
      <div class="subfield"><label>Alcance</label><select id="pf_alcance"><option value="todo" ${c.alcance==='todo'?'selected':''}>Todo el catálogo</option><option value="categoria" ${c.alcance==='categoria'?'selected':''}>Una categoría</option></select></div>
      <div class="subfield" id="pf_catwrap" style="display:${c.alcance==='categoria'?'block':'none'}"><label>Categoría</label><select id="pf_cat">${(CONFIG.CATEGORIAS||[]).map(x=>`<option ${c.categoria===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="subfield"><label>% de descuento</label><input id="pf_pct" type="number" value="${c.pct??''}" placeholder="Ej. 10"></div>`;
  }

  $('#modal').innerHTML = `
    <h3>${id?'Editar':'Nueva'} promoción</h3>
    <div class="field"><label>Nombre</label><input id="prNombre" value="${esc(p.nombre||'')}" placeholder="Ej. 2 árabes de 5ml x S/32"></div>
    <div class="field"><label>Tipo</label>
      <div class="chips" id="tipoPick">${PROMO_TIPOS.map(t=>`<button type="button" class="np ${tipo===t[0]?'sel':''}" data-t="${t[0]}">${t[1]} ${t[2]}</button>`).join('')}</div>
    </div>
    <div id="promoBody">${bodyFor(tipo)}</div>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label>Desde (opcional)</label><input id="prDesde" type="date" value="${p.desde||''}"></div>
      <div class="field"><label>Hasta (opcional)</label><input id="prHasta" type="date" value="${p.hasta||''}"></div>
    </div>
    <div class="check"><input type="checkbox" id="prActivo" ${p.activo!==false?'checked':''}><label for="prActivo">Activa</label></div>
    <div class="actions"><button class="btn" id="savePromo">${id?'Guardar':'Crear'}</button><button class="btn ghost" id="cancelPromo">Cancelar</button></div>`;

  function bindPickers(){
    const bodyEl=$('#promoBody');
    bodyEl.querySelectorAll('#promoProds [data-p]').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
    bodyEl.querySelectorAll('#promoMls [data-m]').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
    const alc=bodyEl.querySelector('#pf_alcance');
    if(alc) alc.onchange=()=>{ bodyEl.querySelector('#pf_catwrap').style.display=alc.value==='categoria'?'block':'none'; };
  }
  bindPickers();
  $('#tipoPick').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    tipo=b.dataset.t; document.querySelectorAll('#tipoPick .np').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    $('#promoBody').innerHTML=bodyFor(tipo); bindPickers();
  });

  function getChecked(wrapId,attr){ return [...document.querySelectorAll(`#${wrapId} .np.sel`)].map(el=>el.dataset[attr]); }
  function buildConfig(){
    const cat2=()=>{ const el=$('#pf_cat2'); return el&&el.value!=='todas'?el.value:null; };
    if(tipo==='producto') return { productos:getChecked('promoProds','p'), categoria:cat2(), mls:getChecked('promoMls','m'), pct:+$('#pf_pct').value||0 };
    if(tipo==='cantidad') return { productos:getChecked('promoProds','p'), categoria:cat2(), mls:getChecked('promoMls','m'), min:+$('#pf_min').value||0, modo:$('#pf_modo').value, valor:+$('#pf_valor').value||0 };
    if(tipo==='combo')    return { productos:getChecked('promoProds','p'), categoria:cat2(), mls:getChecked('promoMls','m'), cantidad:+$('#pf_cant').value||0, precio_total:+$('#pf_total').value||0 };
    const alc=$('#pf_alcance').value; return { alcance:alc, categoria:alc==='categoria'?$('#pf_cat').value:null, pct:+$('#pf_pct').value||0 };
  }

  $('#cancelPromo').onclick=closeOv;
  $('#savePromo').onclick = async () => {
    const nombre=$('#prNombre').value.trim(); if(!nombre){ toast('Ponle nombre',true); return; }
    const payload={ nombre, tipo, config:buildConfig(), desde:$('#prDesde').value||null, hasta:$('#prHasta').value||null, activo:$('#prActivo').checked };
    const {error}= id ? await sb.from('promociones').update(payload).eq('id',id) : await sb.from('promociones').insert(payload);
    if(error){ toast('Error: '+error.message,true); return; }
    toast('Guardado ✓'); closeOv(); loadPromos();
  };
  openOv();
}
async function delPromo(id){ if(!confirm('¿Eliminar esta promoción?'))return; const {error}=await sb.from('promociones').delete().eq('id',id); if(error){toast('Error: '+error.message,true);return;} toast('Eliminada'); loadPromos(); }

/* ============ Overlay + acciones ============ */
function openOv(){ $('#ov').classList.add('open'); document.body.style.overflow='hidden'; }
function closeOv(){ $('#ov').classList.remove('open'); document.body.style.overflow=''; }
$('#newProd').onclick=()=>prodForm(null);
$('#newNota').onclick=()=>notaForm(null);
$('#newPromo').onclick=()=>promoForm(null);

let tt; function toast(m,bad){ const t=$('#toast'); t.textContent=m; t.className='toast show'+(bad?' bad':''); clearTimeout(tt); tt=setTimeout(()=>t.className='toast',2600); }

checkSession();
</script>
</body>
</html>
